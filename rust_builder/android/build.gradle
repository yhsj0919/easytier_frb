// Rust FFI: cargokit builds native code (no Kotlin in this module).

group = "com.flutter_rust_bridge.rust_lib_easytier_frb"
version = "1.0"

apply plugin: "com.android.library"

android {
    namespace = "com.flutter_rust_bridge.rust_lib_easytier_frb"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 21
    }
}

apply from: "../cargokit/gradle/plugin.gradle"

cargokit {
    manifestDir = "../../rust"
    libname = "rust_lib_easytier_frb"
}
