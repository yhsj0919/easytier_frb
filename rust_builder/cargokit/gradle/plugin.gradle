/// Cargokit Gradle integration (patched for Gradle 8.11+ / AGP 9: ExecOperations).

import java.nio.file.Paths
import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations

import javax.inject.Inject

CargoKitPlugin.file = buildscript.sourceFile

apply plugin: CargoKitPlugin

class CargoKitExtension {
    String manifestDir
    String libname
}

abstract class CargoKitBuildTask extends DefaultTask {

    @Inject
    abstract ExecOperations getExecOperations()

    @Input
    String buildMode

    @Input
    String buildDir

    @Input
    String outputDir

    @Input
    String ndkVersion

    @Input
    String sdkDirectory

    @Input
    int compileSdkVersion

    @Input
    int minSdkVersion

    @Input
    String pluginFile

    @Input
    List<String> targetPlatforms

    @TaskAction
    def build() {
        if (project.cargokit.manifestDir == null) {
            throw new GradleException("Property 'manifestDir' must be set on cargokit extension")
        }
        if (project.cargokit.libname == null) {
            throw new GradleException("Property 'libname' must be set on cargokit extension")
        }

        def executableName = Os.isFamily(Os.FAMILY_WINDOWS) ? "run_build_tool.cmd" : "run_build_tool.sh"
        // pluginFile is .../cargokit/gradle/plugin.gradle; manifestDir is relative to cargokit/
        def cargokitDir = new File(pluginFile).parentFile.parentFile
        def path = Paths.get(cargokitDir.absolutePath, executableName).toAbsolutePath().toString()
        def manifestDir = Paths.get(cargokitDir.absolutePath, project.cargokit.manifestDir).toAbsolutePath().toString()
        def rootProjectDir = project.rootProject.projectDir.absolutePath

        if (!Os.isFamily(Os.FAMILY_WINDOWS)) {
            execOperations.exec { spec ->
                spec.commandLine "chmod", "+x", path
            }
        }

        execOperations.exec { spec ->
            spec.executable path
            spec.args "build-gradle"
            spec.environment "CARGOKIT_ROOT_PROJECT_DIR", rootProjectDir
            spec.environment "CARGOKIT_TOOL_TEMP_DIR", "${buildDir}/build_tool"
            spec.environment "CARGOKIT_MANIFEST_DIR", manifestDir
            spec.environment "CARGOKIT_CONFIGURATION", buildMode
            spec.environment "CARGOKIT_TARGET_TEMP_DIR", buildDir
            spec.environment "CARGOKIT_OUTPUT_DIR", outputDir
            spec.environment "CARGOKIT_NDK_VERSION", ndkVersion
            spec.environment "CARGOKIT_SDK_DIR", sdkDirectory
            spec.environment "CARGOKIT_COMPILE_SDK_VERSION", compileSdkVersion.toString()
            spec.environment "CARGOKIT_MIN_SDK_VERSION", minSdkVersion.toString()
            spec.environment "CARGOKIT_TARGET_PLATFORMS", targetPlatforms.join(",")
            spec.environment "CARGOKIT_JAVA_HOME", System.properties["java.home"]
        }
    }
}

class CargoKitPlugin implements Plugin<Project> {

    static String file

    private static Plugin findFlutterPlugin(Project rootProject) {
        _findFlutterPlugin(rootProject.childProjects)
    }

    private static Plugin _findFlutterPlugin(Map projects) {
        for (project in projects) {
            for (plugin in project.value.getPlugins()) {
                def name = plugin.class.name
                if (name == "com.flutter.gradle.FlutterPlugin" || name == "FlutterPlugin") {
                    return plugin
                }
            }
            def plugin = _findFlutterPlugin(project.value.childProjects)
            if (plugin != null) {
                return plugin
            }
        }
        return null
    }

    private static int parseCompileSdkVersion(def compileSdk) {
        if (compileSdk == null) {
            return 35
        }
        def text = compileSdk.toString()
        if (text.isInteger()) {
            return text as int
        }
        def digits = text.replaceAll(/[^0-9]/, "")
        if (digits.isEmpty()) {
            return 35
        }
        return digits as int
    }

    @Override
    void apply(Project project) {
        def plugin = findFlutterPlugin(project.rootProject)
        project.extensions.create("cargokit", CargoKitExtension)

        if (plugin == null) {
            println("Flutter plugin not found, CargoKit will not be applied.")
            return
        }

        def cargoBuildDir = "${project.layout.buildDirectory.get()}/build"
        def isApplication = plugin.project.plugins.hasPlugin("com.android.application")
        def variants = isApplication
            ? plugin.project.android.applicationVariants
            : plugin.project.android.libraryVariants

        variants.all { variant ->
            final buildType = variant.buildType.name
            def cargoOutputDir = "${project.layout.buildDirectory.get()}/jniLibs/${buildType}"
            def jniLibs = project.android.sourceSets.maybeCreate(buildType).jniLibs
            jniLibs.srcDir(new File(cargoOutputDir))

            def List<String> platforms
            try {
                platforms = com.flutter.gradle.FlutterPluginUtils.getTargetPlatforms(project).collect()
            } catch (Exception ignored) {
                platforms = plugin.getTargetPlatforms().collect()
            }

            if (buildType == "debug") {
                platforms.add("android-x86")
                platforms.add("android-x64")
            }

            project.gradle.afterProject {
                def taskName = "cargokitCargoBuild${project.cargokit.libname.capitalize()}${buildType.capitalize()}"

                if (project.tasks.findByName(taskName)) {
                    return
                }

                if (plugin.project.android.ndkVersion == null) {
                    throw new GradleException("Please set 'android.ndkVersion' in app/build.gradle.")
                }

                def task = project.tasks.create(taskName, CargoKitBuildTask.class) {
                    buildMode = variant.buildType.name
                    buildDir = cargoBuildDir
                    outputDir = cargoOutputDir
                    ndkVersion = plugin.project.android.ndkVersion
                    sdkDirectory = plugin.project.android.sdkDirectory
                    minSdkVersion = plugin.project.android.defaultConfig.minSdkVersion.apiLevel as int
                    compileSdkVersion = parseCompileSdkVersion(plugin.project.android.compileSdkVersion)
                    targetPlatforms = platforms
                    pluginFile = CargoKitPlugin.file
                }

                def onTask = { newTask ->
                    if (newTask.name == "merge${buildType.capitalize()}NativeLibs") {
                        newTask.dependsOn task
                        newTask.outputs.upToDateWhen { false }
                    }
                }
                project.tasks.each onTask
                project.tasks.whenTaskAdded onTask
            }
        }
    }
}
